<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supreme Coffee</title>
<meta name="description" content="Finest aroma, supreme taste — café especial passado na hora.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;900&display=swap" rel="stylesheet">
<style>
  :root { --beige:#ecdcc9; --brown:#4e372e; --cream:#e6d2bb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:var(--beige); color:var(--brown); font-family:Inter, system-ui, sans-serif; overflow-x:hidden; }
  .scene { position:relative; height:100vh; height:100svh; overflow:hidden; background:var(--beige); }
  .fill { position:absolute; inset:0; opacity:0; background:linear-gradient(#c8dfe8 0 62%, #e7dcc8 62%); }
  .stage { overflow:hidden; position:absolute; left:50%; top:50%; width:1440px; height:1024px; transform-origin:50% 50%; }
  .lyr, .txt { position:absolute; left:0; top:0; will-change:transform; user-select:none; pointer-events:none; }
  .lyr { display:block; }
  .txt { font-weight:900; line-height:1.21; white-space:nowrap; letter-spacing:0; }
  body:not(.ready) .stage { visibility:hidden; }

  /* menu */
  header { position:fixed; inset:0 0 auto 0; z-index:10; height:calc(120 * var(--hs)); --hs:min(1px, 100vw / 1440); }
  header .in { position:relative; width:1440px; height:120px; transform:scale(calc(var(--hs) / 1px)); transform-origin:0 0; }
  header .logo { position:absolute; left:0; top:0; width:288px; height:227px; }
  header .logo img { width:100%; height:100%; }
  header nav a { position:absolute; top:66px; font-size:22px; font-weight:500; color:var(--brown); text-decoration:none; transition:opacity .2s; }
  header nav a:hover { opacity:.6; }
  header .buy { position:absolute; left:1195px; top:60px; width:129px; height:42px; border-radius:10px; background:var(--brown); color:var(--cream); font:500 22px Inter, sans-serif; border:0; cursor:pointer; text-decoration:none; display:flex; align-items:center; justify-content:center; transition:transform .2s; }
  header .buy:hover { transform:translateY(-2px); }
  .burger { display:none; }

  .hint { position:fixed; left:50%; bottom:28px; transform:translate(-50%, 10px); z-index:9; font:500 14px Inter, sans-serif; color:var(--brown); opacity:0; transition:.5s; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .hint.show { opacity:.75; transform:translate(-50%, 0); }
  .hint i { width:22px; height:34px; border:2px solid currentColor; border-radius:12px; position:relative; }
  .hint i::after { content:""; position:absolute; left:50%; top:6px; width:4px; height:7px; margin-left:-2px; border-radius:2px; background:currentColor; animation:wheel 1.6s infinite; }
  @keyframes wheel { 0%{opacity:0;transform:translateY(0)} 30%{opacity:1} 100%{opacity:0;transform:translateY(10px)} }

  @media (max-width: 767px) {
    header { height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
    header .in { display:contents; transform:none; }
    header .logo { position:static; width:44px; height:44px; overflow:hidden; display:block; }
    header .logo { position:relative; display:block; } header .logo img { position:absolute; width:173px; height:auto; max-width:none; left:-64px; top:-26px; }
    header nav { position:fixed; inset:72px 16px auto 16px; background:var(--beige); border-radius:14px; padding:8px; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(78,55,46,.18); transform:translateY(-12px); opacity:0; pointer-events:none; transition:.25s; }
    header nav.open { transform:none; opacity:1; pointer-events:auto; }
    header nav a { position:static; font-size:18px; padding:12px; }
    header .right { display:flex; gap:10px; align-items:center; margin-left:auto; }
    header .buy { position:static; width:auto; height:40px; padding:0 16px; font-size:16px; }
    .burger { display:flex; width:40px; height:40px; border:0; border-radius:10px; background:transparent; color:var(--brown); align-items:center; justify-content:center; cursor:pointer; }
  }
  @media (prefers-reduced-motion: reduce) { .hint i::after { animation:none; } }
</style>
</head>
<body>
<header>
  <div class="in">
    <a class="logo" href="#" aria-label="Início"><img src="assets/logo.png" alt="Supreme Coffee"></a>
    <nav id="menu">
      <a href="#" style="left:368px">shop</a>
      <a href="#" style="left:474px">flavours</a>
      <a href="#" style="left:613px">our team</a>
      <a href="#" style="left:757px">our stores</a>
      <a href="#" style="left:910px">sustainability</a>
    </nav>
    <div class="right">
      <a class="buy" href="#">buy now</a>
      <button class="burger" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h16M3 11h16M3 16h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="scene" aria-label="Finest aroma, supreme taste">
    <div class="fill"></div>
    <div class="stage"></div>
  </section>
</main>
<div class="hint" aria-hidden="true"><i></i>role para descobrir</div>

<script>
/* Dados extraídos do Figma (quadros Coffee 1 → 6). x,y = centro da camada. */
const B = (l, t, w, h, r = 0, o = 1, extra = {}) => Object.assign({ x: l + w / 2, y: t + h / 2, w, h, r, o }, extra);
const C = (cx, cy, w, h, r = 0, o = 1) => ({ x: cx, y: cy, w, h, r, o });
const T = (bottom, o = 1) => ({ x: 720, y: bottom, o });
const part = (name, s3x) => ({ src: `assets/${name}.png`, s: [C(s3x, 558, 880, 880),,, , C(706, 558, 880, 880), C(706, 558, 880, 880)] });
const bean = (n, l, t0, t1) => ({ src: `assets/bean-${n}.png`, s: [B(l, t0, 1694, 1252), B(l, t1, 1694, 1252)] });

window.SCENE = {
  width: 1440, height: 1024, states: 6, mobileFocus: 900,
  fill: [0, 0, 1, 1, 1, 1],
  layers: [
    { src: 'assets/blue-bg.png', s: [B(-69, 0, 1578, 1350, 0, 0), B(-69, 0, 1578, 1350, 0, 0), B(-69, 0, 1578, 1350), B(-69, 0, 1578, 1350), B(-69, -300, 1578, 1350), B(-69, -300, 1578, 1350)] },
    { text: 'supreme', size: 260, color: '#fff', s: [T(1371), T(1371), T(571), T(-249)] },
    { text: 'taste', size: 260, color: '#fff', s: [T(1611), T(1611), T(811), T(-9)] },
    { text: 'finest', size: 300, color: '#d2a97d', s: [T(-235), T(555), T(-365)] },
    { text: 'aroma', size: 300, color: '#d2a97d', s: [T(20), T(810), T(-110)] },
    { src: 'assets/beans-1.png', s: [B(136.81, -1856, 987.186, 1020.283), , B(136.81, 1114, 987.186, 1020.283), B(136.81, 1134, 987.186, 1020.283)] },
    { src: 'assets/beans-2.png', s: [B(106, -1331.93, 987.186, 1020.283), , B(106, 978.07, 987.186, 1020.283), B(106, 998.07, 987.186, 1020.283)] },
    { src: 'assets/coffee-bottom.png', alt: 'Embalagem de café', s: [C(713.76, -389.74, 1194.235, 881.239), C(730.75, 513.08, 1194.235, 881.239, -172.17), C(727.18, 90.16, 1617.845, 1193.825, -179.75), C(727.18, -499.84, 1617.845, 1193.825, -179.75)] },
    { src: 'assets/coffee-top.png', alt: 'Sachê de café', s: [C(867.66, -532.70, 848, 848), C(559, 634, 848, 848, -76.19), C(518.13, 283.21, 1148.796, 1148.796, -39.16), C(518.13, -306.79, 1148.796, 1148.796, -39.16)] },
    { src: 'assets/coffee-filter.png', alt: 'Filtro de papel', s: [B(270, 1208, 860, 635), , B(86, 531, 1228, 907), B(329, 137, 742, 549), B(635, 137, 372, 275)] },
    part('top-stick', 1876),
    part('bottom-part', -794),
    part('glass-dish-1', -524),
    part('kettle-stick', 1946),
    part('kettle-glass', 1946),
    { src: 'assets/mask-group.png', s: [B(682, 628, 296, 216, 0, 0, { clip: 186 }),,,, B(682, 628, 296, 216, 0, 1, { clip: 186 }), B(682, 628, 296, 216, 0, 1, { clip: 0 })] },
    part('filter-cup-base', 2686),
    part('kettle-frame', 1926),
    part('kettle-handle', 2126),
    part('middle-part', -1024),
    { src: 'assets/filter-cup.png', s: [C(468, 2647, 1584, 1584),, , C(468, 917, 1584, 1584), C(694, 558, 880, 880)] },
    { src: 'assets/filter-top.png', s: [C(468, -424, 1584, 1584),, , C(468, 917, 1584, 1584), C(694, 558, 880, 880)] },
    { src: 'assets/coffee-beans-table.png', s: [B(-1169, 849, 469, 159),,, , B(-129, 849, 469, 159)] },
    { src: 'assets/coffee-beans-table-2.png', s: [B(2245, 877, 364, 116),,, , B(1155, 877, 364, 116)] },
    bean(1, -234, -1868, 2172), bean(2, -134, -1358, 872), bean(7, -324, -1638, 1172),
    bean(3, 16, -1088, 1142), bean(4, -234, -1068, 1022), bean(5, -234, -1768, 2292),
    bean(6, -34, -1298, 932), bean(8, 136, -1218, 1152), bean(9, 101, -1282, 1128),
  ],
};

// menu mobile
const burger = document.querySelector('.burger'), menu = document.getElementById('menu');
burger.addEventListener('click', () => { const o = menu.classList.toggle('open'); burger.setAttribute('aria-expanded', o); });
menu.addEventListener('click', () => { menu.classList.remove('open'); burger.setAttribute('aria-expanded', false); });
</script>
<script src="js/gsap.min.js"></script>
<script src="js/ScrollTrigger.min.js"></script>
<script src="scene.js"></script>
</body>
</html>
